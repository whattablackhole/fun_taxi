
services:
  driver_service:
    build:
      context: ./driver_service_rs
      dockerfile: Dockerfile
    container_name: fun_taxi-driver_service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "7077:7077"
  geo_service:
    build:
      context: ./geo_service_rs
      dockerfile: Dockerfile
    container_name: fun_taxi-geo_service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
     - "8080:8080"
  bot_service:
    build:
      context: ./bot_service_rs
      dockerfile: Dockerfile
    container_name: fun_taxi-bot_service
    depends_on:
      - driver_service
      - geo_service
    dns:
      - 8.8.8.8
      - 1.1.1.1

