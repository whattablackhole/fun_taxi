[package]
name = "geo_service_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7.1"
reqwest = "0.12.12"
tokio = { version = "1", features = ["full"] }
serde =  { version = "1.0.217", features = ["derive"] }
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
dotenv = "0.15"
log = "*"
schema_registry_converter = { version = "4.5.0", features = ["proto_raw"] }
prost = "0.14.1"
redis = { version = "0.32.4", features = ["tokio-comp"] }
env_logger = "0.11"
[build-dependencies]
prost-build = "0.12.4"
prost-types = "0.12"
