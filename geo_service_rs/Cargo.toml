[package]
name = "geo_service_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
reqwest = "0.12.12"
tokio = { version = "1", features = ["full"] }
serde =  { version = "1.0.217", features = ["derive"] }
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
dotenv = "0.15"
log = "*"
schema_registry_converter = { version = "4.5.0", features = ["proto_raw"] }
redis = { version = "0.32.4", features = ["tokio-comp"] }
env_logger = "0.11"
lapin = "3.1.0"
futures-util = "0.3.31"
tonic = "0.14.0"
prost = "0.14.0"
tonic-prost = "0.14.0"
serde_json = "1.0.142"
[build-dependencies]
tonic-prost-build = "0.14"
