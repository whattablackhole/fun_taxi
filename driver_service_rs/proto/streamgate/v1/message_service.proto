syntax = "proto3";

package fun_taxi_messages_proto.streamgate.v1;
option csharp_namespace = "FunTaxi.Messages.StreamGate.V1";

message StreamGateMessage {
   string user_id = 1;
   bytes payload = 2;
}

message StreamGateMessageReply {
   string user_id = 1;
   bool ok = 2;
}

 service StreamGateMessageService {
  rpc SendMessage (StreamGateMessage) returns (StreamGateMessageReply);
}