[package]
name = "driver_service_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7.0"
actix-ws = "0.3.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
dotenv = "0.15"
tonic = "0.14.0"
prost = "0.14.0"
tonic-prost = "0.14.0"
lapin = "3.2.0"
log = "0.4.27"
env_logger = "0.11.8"

[build-dependencies]
tonic-prost-build = "0.14"
