[package]
name = "streamgate_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
dotenv = "0.15"
tonic = "0.14.0"
prost = "0.14.0"
tonic-prost = "0.14.0"
redis = { version = "0.32.4", features = ["tokio-comp"] }
lapin = "3.2.0"
log = "0.4.27"
env_logger = "0.11.8"
rustls = { version = "0.23",  features = ["ring"] }
hyper =  { version = "1.6.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
axum = {version = "0.8.4", features = ["ws", "tokio", "json", "http2", "http1"]}
axum_tonic = { path = "./axum-tonic" }
thiserror = "2.0.15"
hyper-util ={ version =  "0.1.16" , features = ["full"] }
tokio-rustls = "0.26.2"
rustls-pemfile = "2.2.0"
ring = "0.17.14"

[build-dependencies]
tonic-prost-build = "0.14"

